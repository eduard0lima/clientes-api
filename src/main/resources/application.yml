spring:
  application:
    name: clientes-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clientes}
    username: ${DB_USER:clientes}
    password: ${DB_PASSWORD:clientes}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/clientes}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/realms/clientes/protocol/openid-connect/certs}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:clientes}
    password: ${RABBITMQ_PASSWORD:clientes}
    publisher-confirm-type: correlated
    publisher-returns: true

integracoes:
  score:
    url: ${SCORE_URL:http://localhost:8082}
    connect-timeout: ${SCORE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SCORE_READ_TIMEOUT:2s}

aplicacao:
  fuso-horario: ${APP_TIME_ZONE:America/Sao_Paulo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
